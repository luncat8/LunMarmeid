		function safeNodeForJson(node) {
			return {
				id: node.id,
				label: node.label,
				left: node.left,
				top: node.top,
				w: node.w,
				h: node.h,
				shape: node.shape,
				color: node.color,
				hsl: node.hsl ? { h: node.hsl.h, s: node.hsl.s, l: node.hsl.l } : null,
				parent: node.parent || null,
				children: (node.children || []).slice()
			};
		}

		function serializeEditorState() {
			const nodeList = [];
			for (const id in nodes) nodeList.push(safeNodeForJson(nodes[id]));
			return {
				version: 1,
				type: 'mermaid-visual-editor-objects',
				direction: direction,
				template: { ...template },
				nextNodeId: nextNodeId,
				nextLinkId: nextLinkId,
				canvas: {
					zoom: canvasZoom,
					panX: canvasPanX,
					panY: canvasPanY,
					width: canvasBaseWidth,
					height: canvasBaseHeight,
					frameW: referenceFrameWidth,
					frameH: referenceFrameHeight,
					snap: snapToGrid
				},
				nodes: nodeList,
				links: links.map(l => ({ id: l.id, from: l.from, to: l.to, label: l.label || '', color: l.color || '#555555' }))
			};
		}

		function updateUndoRedoButtons() {
			if (undoBtn) undoBtn.disabled = historyIndex <= 0;
			if (redoBtn) redoBtn.disabled = historyIndex < 0 || historyIndex >= historyStack.length - 1;
		}

		function pushHistorySnapshot() {
			if (isApplyingHistory) return;
			const json = JSON.stringify(serializeEditorState());
			if (historyStack[historyIndex] === json) {
				updateUndoRedoButtons();
				return;
			}
			if (historyIndex < historyStack.length - 1) historyStack = historyStack.slice(0, historyIndex + 1);
			historyStack.push(json);
			if (historyStack.length > maxHistoryEntries) historyStack.shift();
			historyIndex = historyStack.length - 1;
			updateUndoRedoButtons();
		}

		function scheduleHistorySnapshot() {
			if (isApplyingHistory) return;
			clearTimeout(historyTimer);
			historyTimer = setTimeout(() => {
				historyTimer = null;
				pushHistorySnapshot();
			}, 250);
		}

		function flushHistorySnapshot() {
			if (historyTimer) {
				clearTimeout(historyTimer);
				historyTimer = null;
				pushHistorySnapshot();
			}
		}

		function applyHistorySnapshot(json) {
			const data = JSON.parse(json);
			isApplyingHistory = true;
			try {
				loadObjectsData(data);
			} finally {
				isApplyingHistory = false;
				updateUndoRedoButtons();
			}
		}

		function undoHistory() {
			flushHistorySnapshot();
			if (historyIndex <= 0) return;
			historyIndex--;
			applyHistorySnapshot(historyStack[historyIndex]);
		}

		function redoHistory() {
			flushHistorySnapshot();
			if (historyIndex >= historyStack.length - 1) return;
			historyIndex++;
			applyHistorySnapshot(historyStack[historyIndex]);
		}

		window.undoHistory = undoHistory;
		window.redoHistory = redoHistory;

		function chooseTextFile(accept, callback) {
			const input = document.createElement('input');
			input.type = 'file';
			input.accept = accept;
			input.style.display = 'none';
			input.addEventListener('change', function() {
				const file = input.files && input.files[0];
				document.body.removeChild(input);
				if (!file) return;
				const reader = new FileReader();
				reader.onload = () => callback(String(reader.result || ''));
				reader.readAsText(file);
			});
			document.body.appendChild(input);
			input.click();
		}

		function loadObjectsData(data) {
			if (!data || !Array.isArray(data.nodes)) {
				alert('Invalid JSON: expected saved Mermaid Visual Editor objects.');
				return;
			}

			nodes = Object.create(null);
			links = Array.isArray(data.links) ? data.links.map((l, idx) => ({
				id: l.id || ('L' + (idx + 1)),
				from: l.from,
				to: l.to,
				label: l.label || '',
				color: l.color || '#555555'
			})) : [];
			linkElements = Object.create(null);
			linkLabelElements = Object.create(null);
			selected = null;

			direction = data.direction || direction || 'TD';
			if (data.template) {
				template = {
					id: data.template.id || 'Node_1',
					label: data.template.label || 'Node',
					shape: data.template.shape || 'rect',
					parent: data.template.parent || '',
					w: parseInt(data.template.w, 10) || defaultTemplateSizeForShape(data.template.shape || 'rect').w,
					h: parseInt(data.template.h, 10) || defaultTemplateSizeForShape(data.template.shape || 'rect').h,
					color: data.template.color || '#e8f4fc'
				};
				if (tmplId) tmplId.value = template.id;
				if (tmplLabel) tmplLabel.value = template.label;
				if (tmplShape) tmplShape.value = template.shape;
				if (tmplW) tmplW.value = template.w;
				if (tmplH) tmplH.value = template.h;
				if (tmplColor) tmplColor.value = template.color;
				renderTemplateParentOptions();
				syncTemplateSizeInputs();
			}

			if (data.canvas) {
				canvasBaseWidth = Math.max(960, parseInt(data.canvas.width, 10) || canvasBaseWidth);
				canvasBaseHeight = Math.max(540, parseInt(data.canvas.height, 10) || canvasBaseHeight);
				canvasZoom = Math.max(0.2, Math.min(4, parseFloat(data.canvas.zoom) || 1));
				canvasPanX = parseFloat(data.canvas.panX) || 0;
				canvasPanY = parseFloat(data.canvas.panY) || 0;
				referenceFrameWidth = Math.max(960, parseFloat(data.canvas.frameW) || referenceFrameWidth);
				referenceFrameHeight = Math.max(540, parseFloat(data.canvas.frameH) || referenceFrameHeight);
				snapToGrid = !!data.canvas.snap;
				if (snapToggle) snapToggle.checked = snapToGrid;
				applyCanvasZoom();
			}

			// Clear DOM nodes but keep SVG defs; redrawLinks will rebuild SVG links.
			const oldNodes = canvasWorld ? canvasWorld.querySelectorAll('.node') : [];
			for (let i = 0; i < oldNodes.length; i++) oldNodes[i].remove();

			for (let i = 0; i < data.nodes.length; i++) {
				const n = data.nodes[i];
				if (!n || !n.id) continue;
				const node = {
					id: n.id,
					label: n.label || n.id,
					left: parseFloat(n.left) || 80,
					top: parseFloat(n.top) || 60,
					w: parseInt(n.w, 10) || (n.shape === 'circle' ? 36 : 90),
					h: parseInt(n.h, 10) || (n.shape === 'circle' ? 36 : 36),
					shape: n.shape || 'rect',
					color: n.color || '#e8f4fc',
					hsl: n.hsl ? { h: n.hsl.h, s: n.hsl.s, l: n.hsl.l, source: n.color || '#e8f4fc' } : null,
					parent: n.parent || null,
					children: []
				};
				nodes[node.id] = node;
				ensureCanvasWorldSize(node.left + 260, node.top + 200);
				createNodeElement(node);
			}

			// Rebuild child lists from parent refs saved in JSON. Do not infer by geometry on load.
			for (const id in nodes) nodes[id].children = [];
			for (const id in nodes) {
				const parentId = nodes[id].parent;
				if (parentId && nodes[parentId] && parentId !== id && !isDescendantNode(parentId, id)) {
					if (!nodes[parentId].children.includes(id)) nodes[parentId].children.push(id);
				} else {
					nodes[id].parent = null;
				}
			}
			applyHierarchyZ();

			nextNodeId = parseInt(data.nextNodeId, 10) || (Object.keys(nodes).length + 1);
			nextLinkId = parseInt(data.nextLinkId, 10) || (links.length + 1);

			updateSelectionUI();
			updateAll();
			lastGeneratedCode = mermaidCode.value || '';
			requestPreviewUpdate();
		}

		function ensureMermaidInitialized() {
			if (!mermaidInitialized) {
				mermaid.initialize({
					startOnLoad: false,
					theme: 'default',
					securityLevel: 'loose',
					flowchart: { curve: 'linear' }

		function safeSvgIdToNodeId(raw) {
			raw = String(raw || '').trim();
			if (!raw) return '';
			raw = raw.replace(/^flowchart-/, '');
			raw = raw.replace(/^node-/, '');
			raw = raw.replace(/-\d+$/g, '');
			raw = raw.replace(/[^A-Za-z0-9_]/g, '_');
			if (/^[0-9]/.test(raw)) raw = 'N_' + raw;
			return raw;
		}

		function getSvgTranslate(el) {
			const tr = el.getAttribute('transform') || '';
			let m = tr.match(/translate\s*\(\s*([-0-9.]+)[,\s]+([-0-9.]+)/);
			if (m) return { x: parseFloat(m[1]) || 0, y: parseFloat(m[2]) || 0 };
			m = tr.match(/matrix\s*\([^,]+,[^,]+,[^,]+,[^,]+,\s*([-0-9.]+)[,\s]+([-0-9.]+)/);
			if (m) return { x: parseFloat(m[1]) || 0, y: parseFloat(m[2]) || 0 };
			return null;
		}

		function getSvgBBoxSafe(el) {
			try {
				const b = el.getBBox();
				if (b && isFinite(b.width) && isFinite(b.height) && b.width > 0 && b.height > 0) {
					return { x: b.x, y: b.y, width: b.width, height: b.height };
				}
			} catch (e) {}

			const rect = el.querySelector('rect');
			if (rect) {
				return {
					x: parseFloat(rect.getAttribute('x')) || 0,
					y: parseFloat(rect.getAttribute('y')) || 0,
					width: parseFloat(rect.getAttribute('width')) || 90,
					height: parseFloat(rect.getAttribute('height')) || 36
				};
			}
			const circle = el.querySelector('circle');
			if (circle) {
				const r = parseFloat(circle.getAttribute('r')) || 36;
				return { x: -r, y: -r, width: r * 2, height: r * 2 };
			}
			const polygon = el.querySelector('polygon');
			if (polygon) {
				const pts = (polygon.getAttribute('points') || '').trim().split(/\s+/).map(p => p.split(',').map(Number)).filter(p => p.length === 2 && isFinite(p[0]) && isFinite(p[1]));
				if (pts.length) {
					const xs = pts.map(p => p[0]);
					const ys = pts.map(p => p[1]);
					const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
					const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
					return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
				}
			}
			return { x: -45, y: -18, width: 90, height: 36 };
		}

		function findEditorNodeForSvgGroup(g, used) {
			const candidates = [];
			const title = g.querySelector('title');
			if (title && title.textContent) candidates.push(title.textContent.trim());
			if (g.id) candidates.push(g.id, safeSvgIdToNodeId(g.id));
			const dataId = g.getAttribute('data-id');
			if (dataId) candidates.push(dataId, safeSvgIdToNodeId(dataId));

			for (let i = 0; i < candidates.length; i++) {
				const c = safeSvgIdToNodeId(candidates[i]);
				if (nodes[c] && !used[c]) return nodes[c];
				if (nodes[candidates[i]] && !used[candidates[i]]) return nodes[candidates[i]];
			}

			// Last-resort fallback: unique label match. Useful when Mermaid rewrites ids.
			const text = Array.from(g.querySelectorAll('text')).map(t => t.textContent || '').join(' ').trim();
			if (text) {
				let found = null;
				for (const id in nodes) {
					if (!used[id] && (nodes[id].label || '').trim() === text) {
						if (found) return null; // ambiguous duplicate label
						found = nodes[id];
					}
				}
				if (found) return found;
			}
			return null;
		}

		async function applyMermaidLayoutFromSource(sourceText) {
			if (!sourceText || !window.mermaid || !canvasWorld) return false;

			ensureMermaidInitialized();
			const renderId = 'layout_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
			let result;
			try {
				result = await mermaid.render(renderId, sourceText);
			} catch (e) {
				return false;
			}

			// Attach hidden SVG to DOM so getBBox() works in browsers.
			const holder = document.createElement('div');
			holder.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;left:-10000px;top:-10000px;width:auto;height:auto;';
			holder.innerHTML = result.svg;
			document.body.appendChild(holder);

			const svgEl = holder.querySelector('svg');
			if (!svgEl) {
				document.body.removeChild(holder);
				return false;
			}

			const groups = Array.from(svgEl.querySelectorAll('g.node, g.cluster'));
			const used = Object.create(null);
			const placed = [];

			for (let i = 0; i < groups.length; i++) {
				const g = groups[i];
				const node = findEditorNodeForSvgGroup(g, used);
				if (!node) continue;

				const tr = getSvgTranslate(g);
				const b = getSvgBBoxSafe(g);
				let cx, cy;
				if (tr) {
					// Mermaid node groups are normally translated to their center.
					cx = tr.x;
					cy = tr.y;
				} else {
					cx = b.x + b.width * 0.5;
					cy = b.y + b.height * 0.5;
				}

				let w = Math.max(24, Math.round(b.width));
				let h = Math.max(24, Math.round(b.height));
				if (node.shape === 'circle') {
					const r = Math.max(10, Math.round(Math.min(w, h) * 0.5));
					node.w = r;
					node.h = r;
					w = r * 2;
					h = r * 2;
				} else {
					node.w = w;
					node.h = h;
				}

				node.left = cx - w * 0.5;
				node.top = cy - h * 0.5;
				used[node.id] = true;
				placed.push(node);
			}

			document.body.removeChild(holder);
			if (!placed.length) return false;

			// Normalize imported layout so it starts inside our canvas with a small margin.
			let minLeft = Infinity;
			let minTop = Infinity;
			for (let i = 0; i < placed.length; i++) {
				minLeft = Math.min(minLeft, placed[i].left);
				minTop = Math.min(minTop, placed[i].top);
			}
			const dx = 80 - minLeft;
			const dy = 60 - minTop;
			let maxRight = 0;
			let maxBottom = 0;
			for (let i = 0; i < placed.length; i++) {
				const n = placed[i];
				const sz = getNodeVisualSize(n);
				setNodePosition(n, n.left + dx, n.top + dy);
				applyNodeSize(n);
				maxRight = Math.max(maxRight, n.left + sz.w + 220);
				maxBottom = Math.max(maxBottom, n.top + sz.h + 180);
			}
			ensureCanvasWorldSize(maxRight, maxBottom);
			redrawLinks();
			return true;
		}

		async function loadMermaidText(text) {
			if (!mermaidCode) return;

			const sourceText = text || '';
			mermaidCode.value = sourceText;

			// Import objects with our lightweight parser first.
			syncObjectsFromCode(sourceText);

			// On LOAD ONLY: ask Mermaid/Dagre for the actual layout and copy those
			// positions/sizes into the Visual Objects canvas. This is intentionally not
			// repeated on normal edits because Mermaid layout is the expensive part.
			await applyMermaidLayoutFromSource(sourceText);

			updateAll();
			lastGeneratedCode = mermaidCode.value || '';
			requestPreviewUpdate();
			forceRenderPreview();
		}

		function loadMermaidFile() {
			chooseTextFile('.mmd,.mermaid,.txt,text/plain', loadMermaidText);
		}

		async function pasteMermaidClipboard() {
			try {
				const text = await navigator.clipboard.readText();
				loadMermaidText(text);
			} catch (e) {
				alert('Clipboard read failed.');
			}
		}

		function saveObjectsJson() {
			downloadFile('mermaid-objects.json', 'application/json;charset=utf-8', JSON.stringify(serializeEditorState(), null, 2));
		}

		function savePreviewSvg() {
			const svgEl = mermaidRender ? mermaidRender.querySelector('svg') : null;
			if (!svgEl) {
				forceRenderPreview();
				setTimeout(savePreviewSvg, 500);
				return;
			}
			let svgText = svgEl.outerHTML;
			if (!svgText.includes('xmlns=')) {
				svgText = svgText.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
			}
			downloadFile('mermaid-preview.svg', 'image/svg+xml;charset=utf-8', svgText);
		}

		function saveMermaidText() {
			downloadFile('mermaid-code.mmd', 'text/plain;charset=utf-8', mermaidCode ? (mermaidCode.value || '') : '');
		}

		// Expose load/save handlers for inline buttons
		window.loadObjectsJsonFile = loadObjectsJsonFile;
		window.pasteObjectsJsonClipboard = pasteObjectsJsonClipboard;
		window.loadMermaidFile = loadMermaidFile;
		window.pasteMermaidClipboard = pasteMermaidClipboard;
		window.saveObjectsJson = saveObjectsJson;
		window.savePreviewSvg = savePreviewSvg;
		window.saveMermaidText = saveMermaidText;

		// === Utility ===
		function copyCode() {
			const code = mermaidCode.value;
			if (!code) return;
			navigator.clipboard.writeText(code).then(() => {
				const orig = event.currentTarget ? event.currentTarget.textContent : '';
				// flash feedback
				const btns = document.querySelectorAll('.tool-btn');
				for (let i = 0; i < btns.length; i++) {
					if (btns[i].textContent === 'Copy Code') {
						const b = btns[i];
						const old = b.textContent;
						b.textContent = 'Copied!';
						setTimeout(() => { b.textContent = old; }, 1200);
						break;
					}
				}
			}).catch(() => {
				// fallback
				mermaidCode.select();
				document.execCommand('copy');
			});
		}

		// Structural commit for the *editor* (canvas + code).
		// Per requirement: "code changed by any reason -> redraw mermaid"
		// We call updateCodeOnly() which now always does requestPreviewUpdate(),
		// so any structural change (add/delete/drag end/clear/...) will schedule
		// the Mermaid preview redraw (lazily, when the user becomes idle).
		// This keeps the zero-freeze behavior while satisfying the flow.
		function updateAll() {
			applyHierarchyZ();
			redrawLinks();
			renderTemplateParentOptions();
			updateCodeOnly();   // this now also calls requestPreviewUpdate()
			pushHistorySnapshot();
		}

		// Property editing hot path — only the code textarea.
		// Never touches SVG links or mermaid. This must stay allocation-free and instant.
		// Per requirement: any code change (even from property edits) must eventually redraw mermaid.
		function refreshLive() {
			markUserActivity();   // treat live property typing as user activity (delays preview until idle)
			updateCodeOnly();     // this now also calls requestPreviewUpdate() so "code changed by any reason -> redraw mermaid"
			scheduleHistorySnapshot();
		}

		// === NEW BIDIRECTIONAL FLOW (per user request) ===
		// Flow:
		//   create/change objects by manual edit in visual → change code (updateCodeOnly / refreshLive)
		//   code changed by ANY reason → redraw mermaid (the preview)
		//   code changed by MANUAL user edit (in the textarea) → parse & update objects (nodes + links + canvas)

		function isManualCodeEdit() {
			if (!mermaidCode) return false;
			return mermaidCode.value !== lastGeneratedCode;
		}

		function parseMermaidCodeToObjects(code) {
			// Lightweight Mermaid FLOWCHART importer.
			// Notes about libraries checked (2026-06): Mermaid itself exposes validation
			// (mermaid.parse) but not a small browser semantic AST API. Existing lightweight
			// packages are either validation-only or parse only a tiny subset, so this local
			// parser intentionally supports the common flowchart surface we need for visual import:
			// - graph/flowchart directions
			// - subgraph/end (mapped to parent/children)
			// - inline node declarations inside edges
			// - common node shapes [] () (()) {} {{}} ([ ]) [[ ]] [( )] and fallbacks
			// - common edge operators: -->, ---, -.->, ==>, --o, --x, <-->, etc.
			// - edge labels in |label| and simple "-- label -->" form
			// - style, classDef/class, :::class, linkStyle
			// - our own %% visual metadata comments

			const newNodes = Object.create(null);
			const newLinks = [];
			let newDirection = 'TD';
			const nodeStyles = Object.create(null);   // safeId -> color
			const nodeSizes = Object.create(null);    // safeId -> {w,h}
			const nodeParents = Object.create(null);  // safeId -> parent safeId
			const linkStyles = Object.create(null);   // zero-based link index -> color
			const classDefs = Object.create(null);    // className -> color
			const nodeClassRefs = Object.create(null); // safeId -> className
			const idMap = Object.create(null);        // raw Mermaid id -> editor-safe id
			const subgraphStack = [];
			let nodeOrder = 0;

			function stripQuotes(v) {
				v = String(v || '').trim();
				if ((v[0] === '"' && v[v.length - 1] === '"') ||
					(v[0] === "'" && v[v.length - 1] === "'") ||
					(v[0] === '`' && v[v.length - 1] === '`')) {
					return v.slice(1, -1);
				}
				return v;
			}

			function normalizeId(raw) {
				raw = stripQuotes(raw).trim();
				if (!raw) raw = 'Node';
				if (idMap[raw]) return idMap[raw];
				let safe = raw.replace(/[^A-Za-z0-9_]/g, '_');
				if (!safe) safe = 'Node';
				if (/^[0-9]/.test(safe)) safe = 'N_' + safe;
				const base = safe;
				let n = 2;
				while (newNodes[safe] && idMap[raw] !== safe) {
					safe = base + '_' + n++;
				}
				idMap[raw] = safe;
				return safe;
			}

			function defaultSize(shape) {
				if (shape === 'circle') return { w: 36, h: 36 };
				if (shape === 'diamond') return { w: 72, h: 72 };
				if (shape === 'stadium') return { w: 110, h: 36 };
				return { w: 90, h: 36 };
			}

			function cleanLabel(label) {
				label = stripQuotes(label || '').trim();
				return label.replace(/^:/, '').trim() || 'Node';
			}

			function parseShapeFromRest(rest) {
				rest = (rest || '').trim();
				if (!rest) return null;

				const candidates = [
					{ re: /^\(\((.*?)\)\)/, shape: 'circle' },
					{ re: /^\(\[(.*?)\]\)/, shape: 'stadium' },
					{ re: /^\[\((.*?)\)\]/, shape: 'rect' },      // cylinder/database fallback
					{ re: /^\[\[(.*?)\]\]/, shape: 'rect' },      // subroutine fallback
					{ re: /^\{\{(.*?)\}\}/, shape: 'diamond' },   // hexagon fallback
					{ re: /^\{(.*?)\}/, shape: 'diamond' },
					{ re: /^\((.*?)\)/, shape: 'round' },
					{ re: /^\[\/(.*?)\/\]/, shape: 'rect' },
					{ re: /^\[\\(.*?)\\\]/, shape: 'rect' },
					{ re: /^\[\/(.*?)\\\]/, shape: 'rect' },
					{ re: /^\[\\(.*?)\/\]/, shape: 'rect' },
					{ re: /^\[(.*?)\]/, shape: 'rect' },
					{ re: /^>(.*?)\]/, shape: 'rect' }
				];

				for (let i = 0; i < candidates.length; i++) {
					const m = rest.match(candidates[i].re);
					if (m) return { shape: candidates[i].shape, label: cleanLabel(m[1]) };
				}
				return null;
			}

			function ensureNode(rawId, label, shape, inlineClass) {
				const id = normalizeId(rawId);
				const existing = newNodes[id];
				const sz = nodeSizes[id] || defaultSize(shape || (existing && existing.shape) || 'rect');

				if (existing) {
					if (label && (!existing.label || existing.label === existing.id)) existing.label = label;
					if (shape && existing.shape === 'rect') existing.shape = shape;
					if (inlineClass) {
						nodeClassRefs[id] = inlineClass;
						if (classDefs[inlineClass]) existing.color = classDefs[inlineClass];
					}
					if (nodeStyles[id]) existing.color = nodeStyles[id];
					if (nodeParents[id]) existing.parent = nodeParents[id];
					return existing;
				}

				const currentParent = subgraphStack.length ? subgraphStack[subgraphStack.length - 1] : null;
				if (inlineClass) nodeClassRefs[id] = inlineClass;

				const n = {
					id: id,
					label: label || stripQuotes(rawId) || id,
					shape: shape || 'rect',
					w: sz.w,
					h: sz.h,
					color: (inlineClass && classDefs[inlineClass]) || nodeStyles[id] || '#e8f4fc',
					parent: nodeParents[id] || currentParent || null,
					children: [],
					left: 80 + (nodeOrder % 5) * 150,
					top: 60 + Math.floor(nodeOrder / 5) * 115
				};
				nodeOrder++;
				newNodes[id] = n;
				return n;
			}

			function parseNodeExpr(expr) {
				expr = String(expr || '').trim();
				if (!expr) return null;
				expr = expr.replace(/^[\s;]+|[\s;]+$/g, '');
				expr = expr.replace(/&.*$/g, '').trim(); // Mermaid supports A & B; keep first for importer

				let inlineClass = null;
				const classMatch = expr.match(/:::\s*([A-Za-z0-9_-]+)/);
				if (classMatch) {
					inlineClass = classMatch[1];
					expr = expr.replace(/:::\s*[A-Za-z0-9_-]+/, '').trim();
				}

				const idMatch = expr.match(/^("[^"]+"|'[^']+'|`[^`]+`|[A-Za-z0-9_][A-Za-z0-9_:\-.]*)/);
				if (!idMatch) return null;

				const rawId = stripQuotes(idMatch[1]);
				const rest = expr.slice(idMatch[0].length).trim();
				const parsedShape = parseShapeFromRest(rest);
				return {
					rawId: rawId,
					id: normalizeId(rawId),
					label: parsedShape ? parsedShape.label : null,
					shape: parsedShape ? parsedShape.shape : 'rect',
					inlineClass: inlineClass
				};
			}

			function splitStatements(text) {
				const out = [];
				let cur = '';
				let quote = null;
				let depth = 0;
				for (let i = 0; i < text.length; i++) {
					const ch = text[i];
					if (quote) {
						cur += ch;
						if (ch === quote && text[i - 1] !== '\\') quote = null;
						continue;
					}
					if (ch === '"' || ch === "'" || ch === '`') { quote = ch; cur += ch; continue; }
					if (ch === '[' || ch === '(' || ch === '{') depth++;
					if (ch === ']' || ch === ')' || ch === '}') depth = Math.max(0, depth - 1);
					if ((ch === ';' || ch === '\n') && depth === 0) {
						if (cur.trim()) out.push(cur.trim());
						cur = '';
					} else {
						cur += ch;
					}
				}
				if (cur.trim()) out.push(cur.trim());
				return out;
			}

			function edgeOperatorRegex() {
				// Captures the common Mermaid flowchart edge operators, with optional |label|.
				return /(<-->|<---|-->|---|-.->|-.-|==>|===|--o|--x|o--|x--|~~~)(?:\|([^|]*)\|)?/g;
			}

			function parseSimpleTextLabel(leftPiece, opLabel) {
				if (opLabel) return cleanLabel(opLabel);
				// Support: A -- yes --> B and A -. maybe .-> B in a forgiving way.
				const m = leftPiece.match(/\s--\s*([^\-]+)$/) || leftPiece.match(/\s-\.\s*([^\.]+)$/) || leftPiece.match(/\s==\s*([^=]+)$/);
				return m ? cleanLabel(m[1]) : '';
			}

			function parseEdgeStatement(stmt) {
				const re = edgeOperatorRegex();
				const matches = [];
				let m;
				while ((m = re.exec(stmt)) !== null) {
					matches.push({ index: m.index, end: re.lastIndex, label: m[2] || '' });
				}
				if (!matches.length) return false;

				const pieces = [];
				pieces.push(stmt.slice(0, matches[0].index));
				for (let i = 0; i < matches.length - 1; i++) {
					pieces.push(stmt.slice(matches[i].end, matches[i + 1].index));
				}
				pieces.push(stmt.slice(matches[matches.length - 1].end));

				for (let i = 0; i < matches.length; i++) {
					let fromPiece = pieces[i].trim();
					let toPiece = pieces[i + 1].trim();
					const label = parseSimpleTextLabel(fromPiece, matches[i].label);
					fromPiece = fromPiece.replace(/\s--\s*[^\-]+$/, '').replace(/\s-\.\s*[^\.]+$/, '').replace(/\s==\s*[^=]+$/, '').trim();

					const from = parseNodeExpr(fromPiece);
					const to = parseNodeExpr(toPiece);
					if (!from || !to) continue;

					ensureNode(from.rawId, from.label, from.shape, from.inlineClass);
					ensureNode(to.rawId, to.label, to.shape, to.inlineClass);

					newLinks.push({
						id: 'L' + (newLinks.length + 1),
						from: from.id,
						to: to.id,
						label: label,
						color: linkStyles[newLinks.length] || '#555555'
					});
				}
				return true;
			}

			function applyNodeStyle(rawId, color) {
				const id = normalizeId(rawId);
				nodeStyles[id] = color;
				if (newNodes[id]) newNodes[id].color = color;
			}

			// Strip frontmatter, init blocks, and block comments lightly.
			code = String(code || '').replace(/^---[\s\S]*?---\s*/m, '');
			code = code.replace(/%%\{[\s\S]*?\}%%/g, '');

			const statements = splitStatements(code);

			for (let i = 0; i < statements.length; i++) {
				let line = statements[i].trim();
				if (!line) continue;
				if (/^%%(?!\s*visual\s+)/.test(line)) continue;
				line = line.replace(/\s+%%.*$/, '').trim();
				if (!line) continue;

				// Direction / diagram type
				let dm = line.match(/^(flowchart|graph)\s+([A-Za-z]+)/i);
				if (dm) {
					const d = dm[2].toUpperCase();
					if (d === 'LR' || d === 'TD' || d === 'TB' || d === 'BT' || d === 'RL') newDirection = (d === 'TB' ? 'TD' : d);
					line = line.slice(dm[0].length).trim();
					if (!line) continue;
				}

				// Subgraphs are imported as parent nodes. Nodes parsed while inside a subgraph
				// get parent=<subgraph id>, unless visual metadata later overrides it.
				if (/^subgraph\b/i.test(line)) {
					let rest = line.replace(/^subgraph\s+/i, '').trim();
					let rawId = '';
					let label = '';
					const sm = rest.match(/^("[^"]+"|'[^']+'|`[^`]+`|[A-Za-z0-9_][A-Za-z0-9_:\-.]*)(?:\s*\[(.*)\])?/);
					if (sm) {
						rawId = stripQuotes(sm[1]);
						label = cleanLabel(sm[2] || rawId);
					} else {
						rawId = cleanLabel(rest).replace(/\s+/g, '_');
						label = cleanLabel(rest);
					}
					const sg = ensureNode(rawId, label, 'rect', null);
					sg.w = Math.max(sg.w || 0, 220);
					sg.h = Math.max(sg.h || 0, 140);
					sg.color = nodeStyles[sg.id] || '#f3f6ff';
					subgraphStack.push(sg.id);
					continue;
				}

				if (/^end\b/i.test(line)) {
					subgraphStack.pop();
					continue;
				}

				// Visual metadata comment: %% visual N1 w:90 h:36 parent:N0
				if (line.startsWith('%%')) {
					const vm = line.match(/^%%\s+visual\s+([^\s]+)\s+w:(\d+)\s+h:(\d+)(?:\s+parent:([^\s]+))?/);
					if (vm) {
						const sid = normalizeId(vm[1]);
						const sz = { w: parseInt(vm[2], 10) || 90, h: parseInt(vm[3], 10) || 36 };
						nodeSizes[sid] = sz;
						if (vm[4]) nodeParents[sid] = normalizeId(vm[4]);
						if (newNodes[sid]) {
							newNodes[sid].w = sz.w;
							newNodes[sid].h = sz.h;
							if (nodeParents[sid]) newNodes[sid].parent = nodeParents[sid];
						}
					}
					continue;
				}

				// classDef className fill:#... or style-like class defs
				let cdm = line.match(/^classDef\s+([A-Za-z0-9_-]+)\s+(.*)$/i);
				if (cdm) {
					const fm = cdm[2].match(/\bfill\s*:\s*([^,;\s]+)/) || cdm[2].match(/\bstroke\s*:\s*([^,;\s]+)/);
					if (fm) {
						classDefs[cdm[1]] = fm[1].trim();
						for (const id in nodeClassRefs) {
							if (nodeClassRefs[id] === cdm[1] && newNodes[id]) newNodes[id].color = classDefs[cdm[1]];
						}
					}
					continue;
				}

				// class A,B className
				let cm = line.match(/^class\s+(.+?)\s+([A-Za-z0-9_-]+)\s*$/i);
				if (cm) {
					const cls = cm[2];
					const color = classDefs[cls];
					cm[1].split(',').forEach(raw => {
						const id = normalizeId(raw.trim());
						nodeClassRefs[id] = cls;
						if (color) applyNodeStyle(raw.trim(), color);
					});
					continue;
				}

				// style N1 fill:#d4edda,stroke:#2c3e50,color:#222
				let sm = line.match(/^style\s+([^\s]+)\s+.*?\bfill\s*:\s*([^,;\s]+)/i);
				if (sm) {
					applyNodeStyle(sm[1], sm[2].trim());
					continue;
				}

				// linkStyle 0 stroke:#ff0000,color:#ff0000
				let lm = line.match(/^linkStyle\s+(\d+)\s+.*?\bstroke\s*:\s*([^,;\s]+)/i);
				if (lm) {
					const idx = parseInt(lm[1], 10);
					const color = lm[2].trim();
					linkStyles[idx] = color;
					if (newLinks[idx]) newLinks[idx].color = color;
					continue;
				}

				// click/call/accTitle/accDescr/directives are intentionally ignored for visual import.
				if (/^(click|call|accTitle|accDescr|direction)\b/i.test(line)) continue;

				if (parseEdgeStatement(line)) continue;

				// Standalone node declaration.
				const parsedNode = parseNodeExpr(line);
				if (parsedNode) {
					ensureNode(parsedNode.rawId, parsedNode.label, parsedNode.shape, parsedNode.inlineClass);
				}
			}

			// Apply class colors that were declared after inline :::class usage.
			for (const id in nodeClassRefs) {
				const cls = nodeClassRefs[id];
				if (newNodes[id] && classDefs[cls] && !nodeStyles[id]) newNodes[id].color = classDefs[cls];
			}

			// Rebuild child lists from parent refs.
			for (const id in newNodes) newNodes[id].children = [];
			for (const id in newNodes) {
				const parentId = newNodes[id].parent;
				if (parentId && newNodes[parentId] && parentId !== id) {
					newNodes[parentId].children.push(id);
				} else {
					newNodes[id].parent = null;
				}
			}

			return { nodes: newNodes, links: newLinks, direction: newDirection };
		}

		function syncObjectsFromCode(code) {
			if (!code || !canvas) return;

			const parsed = parseMermaidCodeToObjects(code);
			const oldNodeIds = Object.keys(nodes);
			const newNodeIds = Object.keys(parsed.nodes);

			// Remove nodes that no longer exist in code
			for (let i = oldNodeIds.length - 1; i >= 0; i--) {
				const id = oldNodeIds[i];
				if (!parsed.nodes[id]) {
					const el = nodes[id] && nodes[id].element;
					if (el && el.parentNode) el.parentNode.removeChild(el);
					delete nodes[id];
				}
			}

			// Add or update nodes
			for (const id in parsed.nodes) {
				const p = parsed.nodes[id];
				if (nodes[id]) {
					// update existing
					const n = nodes[id];
					if (n.label !== p.label) {
						n.label = p.label;
						if (n.element) {
							const lbl = n.element.querySelector('.node-label');
							if (lbl) lbl.textContent = p.label;
						}
					}
					if (n.shape !== p.shape) {
						n.shape = p.shape;
						if (n.element) {
							n.element.className = 'node shape-' + n.shape + (selected && selected.type === 'node' && selected.id === n.id ? ' selected' : '');
						}
						applyNodeSize(n);
					}
					if (n.w !== p.w || n.h !== p.h) {
						n.w = p.w;
						n.h = p.h;
						applyNodeSize(n);
					}
					if (n.parent !== p.parent) {
						setNodeParent(n, p.parent || null);
					}
					if (n.color !== p.color) {
						n.color = p.color;
						if (n.element) n.element.style.backgroundColor = n.color;
					}
				} else {
					// create new (preserve parsed position if it had one, otherwise reasonable default)
					const node = {
						id: p.id,
						label: p.label,
						left: (p.left || 80) + (Object.keys(nodes).length * 7) % 180,
						top: (p.top || 60) + (Object.keys(nodes).length * 11) % 140,
						w: p.w,
						h: p.h,
						shape: p.shape,
						color: p.color,
						parent: p.parent || null,
						children: []
					};
					nodes[id] = node;
					createNodeElement(node);
				}
			}

			// Rebuild child lists from parsed parent refs. Do not infer by geometry from code sync.
			for (const id in nodes) nodes[id].children = [];
			for (const id in nodes) {
				const parentId = nodes[id].parent;
				if (parentId && nodes[parentId] && parentId !== id && !isDescendantNode(parentId, id)) {
					if (!nodes[parentId].children.includes(id)) nodes[parentId].children.push(id);
				} else {
					nodes[id].parent = null;
				}
			}
			applyHierarchyZ();

			// Replace links completely (lightweight)
			links = parsed.links.map((l, idx) => ({
				id: 'L' + (idx + 1),
				from: l.from,
				to: l.to,
				label: l.label,
				color: l.color || '#555555'
			}));

			// Update direction if changed
			if (parsed.direction && parsed.direction !== direction) {
				direction = parsed.direction;
			}

			// Rebuild live canvas + code (but do NOT trigger another mermaid render here to avoid loops)
			updateCodeOnly();   // keeps lastGeneratedCode in sync
			redrawLinks();
			updateHighlights();

			// If user had a selection that no longer exists, clear it
			if (selected) {
				if (selected.type === 'node' && !nodes[selected.id]) {
					deselect();
				} else if (selected.type === 'multi') {
					selected.ids = (selected.ids || []).filter(id => !!nodes[id]);
					if (selected.ids.length < 2) selectMultipleNodes(selected.ids);
				} else if (selected.type === 'link') {
					const stillExists = links.some(l => l.id === selected.id);
					if (!stillExists) deselect();
				}
			}
		}

		// Wire the textarea for manual edits
		function setupCodeTextareaListener() {
			if (!mermaidCode) return;

			let editTimer = null;

			mermaidCode.addEventListener('input', function() {
				// Any change to the code area should eventually redraw the mermaid preview.
				// But only a *manual* edit (value differs from lastGeneratedCode) should rebuild the visual objects.
				markUserActivity(); // keep preview from firing *during* typing

				clearTimeout(editTimer);
				editTimer = setTimeout(() => {
					const current = mermaidCode.value || '';

					// "code changed by any reason -> redraw mermaid"
					// Always schedule the lazy path.
					requestPreviewUpdate();

					// For better responsiveness on manual edits in the box, also try a quick render
					// if the user has stopped for a moment (the activity guard will still protect
					// if they keep typing rapidly).
					if (!isRenderingMermaid && (Date.now() - lastUserActivity > 120)) {
						setTimeout(() => {
							if (!isRenderingMermaid && (Date.now() - lastUserActivity > 60)) {
								performMermaidRender();
							}
						}, 40);
					}

					if (isManualCodeEdit()) {
						// Manual user edit → rebuild canvas objects from the new code
						syncObjectsFromCode(current);
						// After sync, the objects + code are in sync again.
						// syncObjectsFromCode regenerates the textarea; keep the baseline
						// equal to what is actually in the textarea after sync.
						lastGeneratedCode = mermaidCode.value || '';
					}
				}, 180); // small debounce
			});

			// Also react to blur / paste for immediate response
			mermaidCode.addEventListener('blur', function() {
				const current = mermaidCode.value || '';
				if (isManualCodeEdit()) {
					syncObjectsFromCode(current);
					lastGeneratedCode = mermaidCode.value || '';
				}
				requestPreviewUpdate();
			});

			mermaidCode.addEventListener('paste', function() {
				// paste can be large; give the browser a moment then process
				setTimeout(() => {
					const current = mermaidCode.value || '';
					if (isManualCodeEdit()) {
						syncObjectsFromCode(current);
						lastGeneratedCode = mermaidCode.value || '';
					}
					requestPreviewUpdate();
				}, 80);
			});
		}

// === Measurement for the Selected Properties "background panel" ===
// Per user request: size the background panel (last .panel) to the MAX height
// needed by the tallest content (real 3-row node form). This value is used for
// BOTH min-height and max-height so the panel box is locked to that size.
// - "create background panel of max of what we need ... that will be limit min and max size together"
// - "properly automatic calculate using available editors, so it set to max"
// We prefer measuring a live replica of the FULL panel (including h3 + paddings)
// built from the actual #prop-content content the user sees. This gives the
// exact height the background panel must reserve.

		// === Bootstrap ===
		function init() {
			// Cache elements
			canvasPane = document.getElementById('canvas-pane');
			canvas = document.getElementById('canvas');
			canvasSpacer = document.getElementById('canvas-spacer');
			canvasWorld = document.getElementById('canvas-world');
			gridSvg = document.getElementById('grid-svg');
			svg = document.getElementById('links-svg');
			propContent = document.getElementById('prop-content');
			selectedPanel = document.getElementById('selected-panel');
			selectedCaption = document.getElementById('selected-caption');
			selectionDropdown = document.getElementById('selection-dropdown');
			mermaidRender = document.getElementById('mermaid-render');
			mermaidCode = document.getElementById('mermaid-code');
			snapToggle = document.getElementById('snap-toggle');
			undoBtn = document.getElementById('undo-btn');
			redoBtn = document.getElementById('redo-btn');
			colorizeBtn = document.getElementById('colorize-btn');
			updateUndoRedoButtons();
			applyCanvasZoom();

			// Boot the rest
			setupCanvas();
			setupSnapToggle();
			setupSelectionDropdown();
			setupResizer();
			setupCodeResizer();
			setupTemplate();
			setupCodeTextareaListener();
			setMode(currentMode);

			loadDemo();

			// Keep infinite grid/reference frame in sync with viewport changes.
			window.addEventListener('load', applyCanvasZoom);
			window.addEventListener('resize', applyCanvasZoom);
		}

		// Boot
		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', init);
		} else {
			init();
		}
	</script>
